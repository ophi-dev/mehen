name: Release Please
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *' # runs daily at midnight UTC
  workflow_dispatch: # Allow manual triggering

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      repository-projects: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please rewrites [workspace.package].version in Cargo.toml but
      # only patches the top-level mehen entry in Cargo.lock — the 17 workspace
      # crates that inherit `version.workspace = true` stay at the old version,
      # which makes `cargo build --locked` fail in CI on the release PR.
      - name: Sync workspace versions in Cargo.lock
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=$(echo "$PR_JSON" | jq -r '.headBranchName')
          if [ -z "$BRANCH" ] || [ "$BRANCH" = "null" ]; then
            echo "No release-please branch reported; skipping lockfile sync."
            exit 0
          fi
          echo "Syncing Cargo.lock on $BRANCH"
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          rustup toolchain install stable --profile minimal --no-self-update
          cargo update --workspace
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already in sync."
            exit 0
          fi
          git config user.name "ophiarch[bot]"
          git config user.email "ophiarch[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build: sync workspace crate versions in Cargo.lock"
          git push origin "$BRANCH"

      # The release-please action creates the git tag when a release PR is merged.
      # Tags created with a GitHub App token (not GITHUB_TOKEN) trigger the
      # release.yml workflow (on tags matching 'v*.*.*'), which builds the CLI
      # archives AND attaches them to the GitHub Release (its `upload-cli-binaries`
      # job). The upload lives there — not here — so it reuses the in-run build
      # artifacts directly instead of polling for release.yml to finish, which
      # previously raced its timeout once builds crossed ~30 min (see v1.4.0).
