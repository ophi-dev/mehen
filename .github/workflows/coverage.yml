name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  # The mehen action posts/updates the sticky PR metrics comment.
  pull-requests: write
  issues: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Full history: `mehen diff` resolves origin/<base> and walks
          # both revisions for the history.* columns.
          fetch-depth: 0

      - name: Set up Rust toolchain
        run: rustup show

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-cache-${{ hashFiles('**/Cargo.lock') }}"
          cache-on-failure: true

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage report
        shell: bash
        env:
          NEXTEST_PROFILE: 'ci'
          RUSTFLAGS: '-C instrument-coverage'
        run: |
          mkdir -p target/llvm-cov
          cargo llvm-cov nextest --workspace --locked --no-fail-fast --all-features --ignore-filename-regex 'src/languages/language_.*\.rs$' --lcov --output-path target/llvm-cov/lcov-branch.info

      # Token-based uploads: OIDC/tokenless uploads have been failing
      # with 404 "Repository not found" since the org rename
      # (ophidiarium → ophi-dev) left codecov's ingest-side repo record
      # stale. CODECOV_TOKEN is the repository *upload* token from the
      # repo's codecov settings page.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          files: target/nextest/ci/junit.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          files: target/llvm-cov/lcov-branch.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

      - name: Upload coverage artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/llvm-cov/lcov-branch.info

      # Dogfooding issue #248: the action consumes the LCOV file just
      # produced — head side directly, base side via the cache/codecov
      # retrieval ladder — so PR comments carry coverage trend columns.
      # Runs even when tests failed (`!cancelled()`): the metrics
      # comment matters most on red PRs; a missing report file only
      # degrades the coverage columns, never the comment.
      - name: Publish mehen metrics
        if: ${{ !cancelled() }}
        uses: ./
        with:
          install-method: cargo
          # `crates` carries the per-language analyzer + engine
          # source after the 1.0 workspace split; `xtask` is the
          # build-helper crate. `docs/` (Mintlify) and the top-level
          # Markdown files feed the Phase-F `<!-- mehen-docs -->`
          # documentation-metrics section. Any path that matches one
          # of mehen's registered Markdown extensions
          # (md/markdown/mdown/mkd/mkdn/mdx) is routed through the
          # documentation pipeline. Keep this list in sync with every
          # root Markdown file so doc-only PRs do not silently skip
          # the self-check.
          paths: |
            crates
            xtask
            docs
            README.md
            AGENTS.md
            CLAUDE.md
            CHANGELOG.md
          # `xtask/templates/grammar.rs` is an askama template — it
          # has the `.rs` extension so language detection routes it
          # through the Rust analyzer, but it carries `{{ c_name }}`
          # and other template directives that don't parse as Rust.
          # The analyzer reports `rust.syntax_error` diagnostics that
          # flip `mehen diff`'s exit code to 1 (per plan §9.3), even
          # when the JSON report is otherwise complete. Skip it.
          exclude: |
            xtask/templates/**
          coverage-files: target/llvm-cov/lcov-branch.info
          codecov-token: ${{ secrets.CODECOV_API_TOKEN }}
