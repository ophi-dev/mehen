name: CI

permissions: {}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  CLICOLOR: 1
  RUSTUP_MAX_RETRIES: 10

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Rust toolchain
        run: rustup show

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-cache-${{ hashFiles('**/Cargo.lock') }}"
          cache-on-failure: true

      - name: Install cargo-insta
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-insta

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run tests
        shell: bash
        env:
          NEXTEST_PROFILE: ci
        # `--workspace` is required: `default-members` in the root
        # `Cargo.toml` restricts root-level cargo commands to the
        # `mehen` package so `cargo build` from the repo root keeps
        # producing `target/release/mehen` (binary-size pipeline).
        # Without `--workspace` here, this step would silently skip
        # every per-language analyzer, the engine, the metrics,
        # report, git, and markdown crates' tests.
        run: cargo insta test --workspace --all-features --check --unreferenced reject --test-runner nextest --no-test-runner-fallback --disable-nextest-doctest

      # nextest cannot run doctests, so the step above passes `--disable-nextest-doctest`.
      # Doctests are compiled by the release job's `cargo test --workspace`, so guard
      # them here too — otherwise a doctest that fails to compile only surfaces at the
      # release tag, after PR CI is already green.
      - name: Run doctests
        shell: bash
        run: cargo test --workspace --all-features --doc

      - name: Smoke test CLI
        shell: bash
        run: |
          cargo build --release
          ./target/release/mehen --help
