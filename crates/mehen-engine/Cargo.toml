[package]
name = "mehen-engine"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Mehen 1.0 — pipeline orchestration, language registry, concurrency (internal)."
publish = false

[dependencies]
mehen-core = { workspace = true }
mehen-metrics = { workspace = true }
mehen-git = { workspace = true }
mehen-report = { workspace = true, features = ["docs-diff"] }
mehen-markdown = { workspace = true }

# Language analyzer crates — feature-gated via the per-language `lang-*`
# features below. The `default` set compiles every analyzer in.
mehen-python = { workspace = true, optional = true }
mehen-typescript = { workspace = true, optional = true }
mehen-php = { workspace = true, optional = true }
mehen-ruby = { workspace = true, optional = true }
mehen-rust = { workspace = true, optional = true }
mehen-go = { workspace = true, optional = true }
mehen-c = { workspace = true, optional = true }
mehen-kotlin = { workspace = true, optional = true }
mehen-java = { workspace = true, optional = true }
mehen-csharp = { workspace = true, optional = true }
mehen-powershell = { workspace = true, optional = true }
mehen-sql = { workspace = true, optional = true }

camino = { workspace = true }
clap = { workspace = true }
# `globset` and `ignore` are pinned here (not in
# `[workspace.dependencies]`) because `mehen-engine` is the only consumer
# — CLI filtering and ignore-aware recursive directory walks are
# engine-only concerns.
globset = "^0.4"
ignore = "^0.4"
gix = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `toml` and `miette` are pinned here (not in `[workspace.dependencies]`)
# because `mehen-engine` is the only consumer — repository-local
# `mehen.toml` loading and its fancy diagnostic rendering are engine-only
# concerns (`config_file` module).
toml = "^1.1"
miette = { version = "^7.6", features = ["fancy"] }

[dev-dependencies]
insta = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }

[features]
default = [
    "lang-python",
    "lang-typescript",
    "lang-php",
    "lang-ruby",
    "lang-rust",
    "lang-go",
    "lang-c",
    "lang-kotlin",
    "lang-java",
    "lang-csharp",
    "lang-powershell",
    "lang-sql",
]
lang-python = ["dep:mehen-python"]
lang-typescript = ["dep:mehen-typescript"]
lang-php = ["dep:mehen-php"]
lang-ruby = ["dep:mehen-ruby"]
lang-rust = ["dep:mehen-rust"]
lang-go = ["dep:mehen-go"]
lang-c = ["dep:mehen-c"]
lang-kotlin = ["dep:mehen-kotlin"]
lang-java = ["dep:mehen-java"]
lang-csharp = ["dep:mehen-csharp"]
lang-powershell = ["dep:mehen-powershell"]
lang-sql = ["dep:mehen-sql"]

[lints]
workspace = true
