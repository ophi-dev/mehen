[package]
name = "mehen-php"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Mehen 1.0 — PHP language analyzer (internal)."
publish = false

[dependencies]
mehen-core = { workspace = true }
mehen-metrics = { workspace = true }
# The `mago-*` crates are pinned here (not in
# `[workspace.dependencies]`) because `mehen-php` is the only consumer.
# All five mago crates ship in lockstep — bump them together. PHP
# keyword case-insensitivity, promoted properties, hooked properties,
# match, attributes, etc. are first-class in mago's typed AST.
# `mago-allocator` provides `LocalArena`, the bump arena mago's parser
# writes into (mago 1.42 replaced the external `bumpalo` dependency
# with its own allocator).
mago-syntax = "=1.43.0"
mago-syntax-core = "=1.43.0"
mago-database = "=1.43.0"
mago-span = "=1.43.0"
mago-allocator = "=1.43.0"
smol_str = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
mehen-report = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
