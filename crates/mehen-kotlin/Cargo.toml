[package]
name = "mehen-kotlin"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Mehen 1.0 — Kotlin language analyzer (internal)."
publish = false

[dependencies]
mehen-core = { workspace = true }
mehen-metrics = { workspace = true }
# The generated Kotlin lexer/parser now live in the standalone, publishable
# `mehen-kotlin-parser` crate (produced by `cargo xtask antlr generate
# kotlin`). This analyzer depends on it for the grammar and reaches the ANTLR
# runtime through its `antlr4_runtime` re-export.
mehen-kotlin-parser = { workspace = true }
# `mehen-antlr` owns the runtime version pin and the shared span/comment/
# diagnostic helpers; the walker reaches the runtime types (`Node`,
# `RuleNodeView`, `TokenView`, …) through its `runtime` re-export.
mehen-antlr = { workspace = true }
smol_str = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
mehen-report = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
