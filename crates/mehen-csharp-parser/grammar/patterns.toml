version = 1

# `record` is a contextual keyword. Roslyn declares
# `<ContextualKind Name="RecordKeyword"/>` on
# RecordDeclarationSyntax.Keyword, but its grammar generator reads only
# `<Kind>`, so the published grammar spells the keyword as the catch-all
# `syntax_token` — which makes `class` viable as a record declaration and
# costs ~quadratic prediction time per type member. `prepare-roslyn-grammar.py`
# restores the restriction as a text comparison on the lookahead token; it
# lowers to a pure SemIR expression, so no typed hook is needed.

[[helper]]
kind = "parser-predicate"
name = "IsRecordKeyword"
returns = "bool"
lower = "cmp(eq, token_text(1), str(\"record\"))"

# `>>` / `>>>` (and their compound assignments) are spelled as adjacent
# `>` tokens so a generic closer never lexes as a shift operator (see
# SHIFT_TOKEN_RULES). Each predicate checks the pieces were adjacent in the
# char stream, so `a >> b` shifts while `List<List<int>>` closes two
# generics. Same lowering the vendored grammars-v4 grammar uses.

[[helper]]
kind = "parser-predicate"
name = "IsRightShift"
returns = "bool"
lower = "token_index_adjacent"

[[helper]]
kind = "parser-predicate"
name = "IsUnsignedRightShift"
returns = "bool"
lower = "token_index_adjacent"

[[helper]]
kind = "parser-predicate"
name = "IsRightShiftAssignment"
returns = "bool"
lower = "token_index_adjacent"

[[helper]]
kind = "parser-predicate"
name = "IsUnsignedRightShiftAssignment"
returns = "bool"
lower = "token_index_adjacent"

# ── interpolated-string state (see lexer-tokens.g4.in) ──────────────────────
#
# `nestDepth` is brace nesting inside the innermost interpolation hole;
# `holeStack` holds one saved depth per enclosing hole, so its own depth answers
# "are we inside a hole at all". Stack-valued member state is runtime 0.20.1+
# (upstream #206).

[[member]]
name = "nestDepth"
kind = "int"
scope = "lexer"

[[member]]
name = "holeStack"
kind = "stack"
scope = "lexer"

# Truthiness only: nonzero means "deeper than the hole's own level".
[[pattern]]
match = "nestDepth > 0"
lower = "not(not(member(nestDepth)))"

# Likewise for the stack's depth: nonzero means a hole is open.
[[pattern]]
match = "holeStack.Count > 0"
lower = "not(not(member_len(holeStack)))"

[[pattern]]
match = "nestDepth++"
lower = "add_member(nestDepth, int(1))"

[[pattern]]
match = "nestDepth--"
lower = "add_member(nestDepth, int(-1))"

# A hole opens: save the enclosing hole's depth, then start this one at 0.
[[pattern]]
match = "holeStack.Push(nestDepth); nestDepth = 0;"
lower = "seq(push_member(holeStack, member(nestDepth)), set_member(nestDepth, int(0)))"

# A hole closes: restore the enclosing depth. `member_top` reads before the pop,
# which is how an assignment-from-pop decomposes in this DSL.
[[pattern]]
match = "nestDepth = holeStack.Pop();"
lower = "seq(set_member(nestDepth, member_top(holeStack)), pop_member(holeStack))"
