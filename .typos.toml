# https://github.com/crate-ci/typos
# cargo install typos-cli
# typos
[files]
# https://github.com/crate-ci/typos/issues/868
extend-exclude = [
    "tree-sitter-*/examples/",
    "**/CHANGELOG.md",
    "**/snapshots/**/*",
    # Machine-generated ANTLR lexer/parser modules and the vendored `.g4`
    # grammars they're generated from. These are not hand-authored prose —
    # Unicode class names like `UNICODE_CLASS_ND` trip the spell checker
    # (`ND` -> `AND`). Same rationale as the generated-snapshot exclude
    # above; regenerate via `cargo xtask antlr generate <lang>`.
    "**/src/generated/**",
    # Hand-written `.g4.in` fragments spliced into the generated grammar carry
    # the same Unicode class names, and the standalone `repro/` grammars are
    # generated copies of the C# pair.
    "crates/mehen-*/grammar/*.g4",
    "crates/mehen-*/grammar/*.g4.in",
    "repro/**/*.g4",
    # Prose-metric dictionaries intentionally contain non-words, cliches,
    # hedges, and weasel phrases for the analyzer to flag. Excluding them
    # from typo checking keeps the analyzer lists authoritative.
    "crates/mehen-markdown/src/data/nonwords.txt",
    "crates/mehen-markdown/src/data/cliches.txt",
    "crates/mehen-markdown/src/data/hedges.txt",
    "crates/mehen-markdown/src/data/weasels.txt",
    "crates/mehen-markdown/src/data/wordy_phrases.txt",
    "crates/mehen-markdown/src/data/inclusive_flags.txt",
    "crates/mehen-markdown/src/data/ja_weak_phrases.txt",
    "crates/mehen-markdown/src/data/ja_redundant.txt",
]

[default.extend-identifiers]
# Common Rust abbreviation for "type" (reserved keyword)
typ = "typ"
typs = "typs"
typs1 = "typs1"
typs2 = "typs2"
# Short for "inherited" in lang_detect.rs block-language inheritance logic.
inh = "inh"

[default.extend-words]
# Intentional misspellings in negative-path tests for the `--fail-on`
# value parser (`src/diff.rs` rejects unknown names via clap).
borken = "borken"
hihg = "hihg"
# Intentional typo in the negative-path test for `history.*` selector
# validation (`metric_selector.rs` rejects unknown history keys).
frequncy = "frequncy"
# Intentional name of a removed language parser
Ccomment = "Ccomment"
"Winn" = "Winn"
"ALOC" = "ALOC"
"ine" = "ine"
"Hge" = "Hge"
"ccontains" = "ccontains"
"Seh" = "Seh"
# Readability formula by Caylor, Sticht, Fox & Ford (1973) — proper noun
"FORCAST" = "FORCAST"
"forcast" = "forcast"
# Proper noun: Jean Ure (lexical density, 1971)
"Ure" = "Ure"
# Proper noun: Yukio Ono (Japanese readability, Tateishi/Ono/Yamada 1988)
"Ono" = "Ono"
# Acronym for Wording Quality Score (§33.11, §36.7)
"WQS" = "WQS"
# Journal abbreviation: Information and Software Technology (Radjenović et al.
# 2013 citation in design-docs/mehen_post_classical_metrics_research_foundation.md)
"IST" = "IST"
# Proper noun: Automattic (harper Rust grammar checker vendor)
"Automattic" = "Automattic"
# Suffix-pattern fragment cited in §33.6 nominalizations (-ment)
"ment" = "ment"
"Dereferencable" = "Dereferencable"
"ue" = "ue"
"mis" = "mis"
"Hashi" = "Hashi"
"requireds" = "requireds"
# Deliberately malformed SQL keyword in the error-recovery probe input quoted
# by design-docs/sql_parser_comparison.md §8.2. The misspelling *is* the test:
# it is what makes `sqlparser::Parser::parse_sql` return a hard `Err` while
# sqruff recovers with an `Unparsable` node. Keep verbatim so the probe stays
# reproducible.
"SELCT" = "SELCT"
# Latin-1 "café" written as raw bytes (`b"# caf\xe9\n"`) in non-UTF-8
# fixture files across the git-history tests; the invalid byte splits
# the word and the checker sees a bare `caf`.
"caf" = "caf"
