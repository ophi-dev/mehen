name: "mehen Source Metrics"
description: "Publish source code metric trends for pull requests"
author: "Ophidiarium"
branding:
  icon: "activity"
  color: "green"

inputs:
  version:
    description: "Version of the mehen npm package to run. Empty means latest."
    required: false
    default: ""
  install-method:
    description: "How to provide the mehen CLI: npm, cargo, or path."
    required: false
    default: "npm"
  mehen-path:
    description: "Path to a mehen executable when install-method is path."
    required: false
    default: "mehen"
  node-version:
    description: "Node.js version used by the action runner."
    required: false
    default: "24"
  paths:
    description: "Repository-relative files or directories to compare. Newline, comma, or semicolon separated."
    required: false
    default: "."
  include:
    description: "Glob patterns to include. Newline, comma, or semicolon separated."
    required: false
    default: ""
  exclude:
    description: "Glob patterns to exclude. Newline, comma, or semicolon separated."
    required: false
    default: ""
  exclude-tests:
    description: "Exclude common test-file patterns (e.g. *_test.go, **/__tests__/**, *.spec.ts) in addition to any user-provided excludes."
    required: false
    default: "true"
  metrics:
    description: "Comma-separated metrics passed to mehen diff."
    required: false
    default: ""
  from:
    description: "Base git revision. Defaults to the PR base branch or main."
    required: false
    default: ""
  to:
    description: "Head git revision. Defaults to the PR head SHA or HEAD."
    required: false
    default: ""
  show-unchanged:
    description: "Include files where all selected metrics are unchanged."
    required: false
    default: "false"
  comment:
    description: "Create or update a pull request comment."
    required: false
    default: "true"
  github-token:
    description: "GitHub token used to update pull request comments."
    required: false
    default: ""
  thresholds:
    description: "Adverse per-file delta limits, for example: cyclomatic=5,cognitive=3,loc.lloc=100."
    required: false
    default: ""
  fail-on-threshold:
    description: "Fail the action when any configured threshold is exceeded."
    required: false
    default: "true"
  comment-title:
    description: "Markdown heading used for the sticky pull request comment."
    required: false
    default: "## 📊 Source Code Metrics"
  coverage-files:
    description: >-
      Coverage report paths produced by an earlier test step (newline, comma, or semicolon
      separated; literal paths, no globs). Passed to mehen diff as head-side --coverage reports.
      On pull requests the same logical reports are retrieved for the base revision and passed
      as --base-coverage (see coverage-base-source); on pushes to the default branch they are
      saved to the Actions cache as future pull-request baselines.
    required: false
    default: ""
  coverage-base-source:
    description: >-
      Where base-revision coverage comes from on pull requests: auto (exact cache hit, then
      workflow artifact, then codecov.io, then nearest default-branch cache, then absent),
      cache, artifact, codecov, or off. Every fallback level is disclosed in the PR comment.
    required: false
    default: "auto"
  coverage-artifact-name:
    description: >-
      Name of a workflow artifact holding coverage report(s), used as a base-coverage source
      on pull requests: the artifact uploaded by the run for the PR's base SHA is downloaded
      and its files are passed as --base-coverage. Artifacts persist ~90 days (the Actions
      cache evicts after 7 unused days), and many repositories already upload coverage
      artifacts — including for GitHub Code Quality's upload job. The artifact should contain
      only coverage report files. Requires `actions: read` permission on the job.
    required: false
    default: ""
  codecov-token:
    description: >-
      Codecov API access token for coverage-base-source auto/codecov: a personal API access
      token generated under Settings -> Access on app.codecov.io — NOT the repository upload
      token (the API rejects upload tokens). Optional for public repositories; required for
      private ones.
    required: false
    default: ""

outputs:
  violations:
    description: "Number of threshold violations (delta thresholds from the `thresholds` input plus repository `mehen.toml` breaches)."
    value: ${{ steps.run.outputs.violations }}
  report_json:
    description: "Path to the JSON diff report produced by mehen."
    value: ${{ steps.run.outputs.report_json }}
  report_markdown:
    description: "Path to the rendered Markdown report."
    value: ${{ steps.run.outputs.report_markdown }}

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Set up Rust toolchain
      if: ${{ inputs.install-method == 'cargo' }}
      uses: dtolnay/rust-toolchain@stable

    # ── Base coverage retrieval (issue #248) ──────────────────────────
    # Push to the default branch: copy the just-produced coverage
    # reports into a staging directory and save them under the pushed
    # SHA, so future pull requests can restore their base revision's
    # reports by exact key. The staging directory lives under
    # runner.temp — restoring it on a PR run can never overwrite the
    # head reports the caller's test step just wrote into the
    # workspace.
    - name: Stage coverage reports for the base cache
      id: coverage-stage
      if: ${{ inputs.coverage-files != '' && (inputs.coverage-base-source == 'auto' || inputs.coverage-base-source == 'cache') && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      shell: bash
      env:
        GHA_MEHEN_COVERAGE_FILES: ${{ inputs.coverage-files }}
        MEHEN_COVERAGE_DIR: ${{ runner.temp }}/mehen-base-coverage
      run: |
        staged=0
        mkdir -p "$MEHEN_COVERAGE_DIR"
        while IFS= read -r entry; do
          f="$(printf '%s' "$entry" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          [ -z "$f" ] && continue
          if [ -f "$f" ]; then
            dest="$MEHEN_COVERAGE_DIR/${f#/}"
            mkdir -p "$(dirname "$dest")"
            cp "$f" "$dest"
            staged=$((staged + 1))
          else
            echo "::warning::mehen: coverage file '$f' not found; it will be missing from the base-coverage cache"
          fi
        done < <(printf '%s\n' "$GHA_MEHEN_COVERAGE_FILES" | tr ',;' '\n\n')
        echo "staged=$staged" >> "$GITHUB_OUTPUT"

    - name: Save base coverage cache
      if: ${{ steps.coverage-stage.outputs.staged != '' && steps.coverage-stage.outputs.staged != '0' }}
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/mehen-base-coverage
        key: mehen-coverage-${{ github.sha }}

    # Pull request: restore the base revision's reports by exact key.
    # On a miss, the prefix restore-key falls back to the most recent
    # default-branch entry — recency-based, not ancestor-aware, so the
    # runner script discloses that level explicitly (and prefers
    # codecov by exact SHA over the fallback under 'auto').
    - name: Restore base coverage cache
      id: coverage-restore
      if: ${{ inputs.coverage-files != '' && (inputs.coverage-base-source == 'auto' || inputs.coverage-base-source == 'cache') && github.event_name == 'pull_request' }}
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/mehen-base-coverage
        key: mehen-coverage-${{ github.event.pull_request.base.sha }}
        restore-keys: |
          mehen-coverage-

    - name: Publish mehen metrics
      id: run
      shell: bash
      run: node "$GITHUB_ACTION_PATH/scripts/github-action.mjs"
      env:
        GHA_MEHEN_VERSION: ${{ inputs.version }}
        GHA_MEHEN_INSTALL_METHOD: ${{ inputs.install-method }}
        GHA_MEHEN_PATH: ${{ inputs.mehen-path }}
        GHA_MEHEN_PATHS: ${{ inputs.paths }}
        GHA_MEHEN_INCLUDE: ${{ inputs.include }}
        GHA_MEHEN_EXCLUDE: ${{ inputs.exclude }}
        GHA_MEHEN_EXCLUDE_TESTS: ${{ inputs.exclude-tests }}
        GHA_MEHEN_METRICS: ${{ inputs.metrics }}
        GHA_MEHEN_FROM: ${{ inputs.from }}
        GHA_MEHEN_TO: ${{ inputs.to }}
        GHA_MEHEN_SHOW_UNCHANGED: ${{ inputs.show-unchanged }}
        GHA_MEHEN_COMMENT: ${{ inputs.comment }}
        GHA_MEHEN_GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
        GHA_MEHEN_THRESHOLDS: ${{ inputs.thresholds }}
        GHA_MEHEN_FAIL_ON_THRESHOLD: ${{ inputs.fail-on-threshold }}
        GHA_MEHEN_COMMENT_TITLE: ${{ inputs.comment-title }}
        GHA_MEHEN_COVERAGE_FILES: ${{ inputs.coverage-files }}
        GHA_MEHEN_COVERAGE_BASE_SOURCE: ${{ inputs.coverage-base-source }}
        GHA_MEHEN_COVERAGE_ARTIFACT_NAME: ${{ inputs.coverage-artifact-name }}
        GHA_MEHEN_CODECOV_TOKEN: ${{ inputs.codecov-token }}
        GHA_MEHEN_COVERAGE_BASE_DIR: ${{ runner.temp }}/mehen-base-coverage
        GHA_MEHEN_COVERAGE_CACHE_HIT: ${{ steps.coverage-restore.outputs.cache-hit }}
        GHA_MEHEN_COVERAGE_CACHE_KEY: ${{ steps.coverage-restore.outputs.cache-matched-key }}
