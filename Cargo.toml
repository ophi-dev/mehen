[workspace]
resolver = "2"
members = [
    "crates/mehen-core",
    "crates/mehen-metrics",
    "crates/mehen-tree-sitter",
    "crates/mehen-antlr",
    "crates/mehen-kotlin-parser",
    "crates/mehen-java-parser",
    "crates/mehen-csharp-parser",
    "crates/mehen-markdown",
    "crates/mehen-python",
    "crates/mehen-typescript",
    "crates/mehen-php",
    "crates/mehen-ruby",
    "crates/mehen-rust",
    "crates/mehen-go",
    "crates/mehen-c",
    "crates/mehen-kotlin",
    "crates/mehen-java",
    "crates/mehen-csharp",
    "crates/mehen-powershell",
    "crates/mehen-sql",
    "crates/mehen-engine",
    "crates/mehen-git",
    "crates/mehen-coverage",
    "crates/mehen-report",
    "crates/mehen-cli",
    "xtask",
]
# `cargo run` / `cargo build` (with no `-p`) target the `mehen`
# package in `crates/mehen-cli/`. The xtask binary is reached via
# `cargo xtask …` (per `.cargo/config.toml`).
default-members = ["crates/mehen-cli"]

[workspace.lints.rust]
# Catch `pub` items in internal crates that are never re-exported across
# crate boundaries — they should be `pub(crate)` so dead-code detection
# stays effective. Members opt in with `[lints] workspace = true`.
unreachable_pub = "warn"

[workspace.package]
version = "1.9.0"
authors = ["Konstantin Vyatkin <tino@vtkn.io>"]
edition = "2024"
rust-version = "1.95.0"
repository = "https://github.com/ophi-dev/mehen"
license = "AGPL-3.0-only"

[workspace.dependencies]
# Internal crates (path-only, never published)
mehen-core = { path = "crates/mehen-core" }
mehen-metrics = { path = "crates/mehen-metrics" }
mehen-tree-sitter = { path = "crates/mehen-tree-sitter" }
mehen-antlr = { path = "crates/mehen-antlr" }
# Generated-only ANTLR parser crates. Unlike the other `mehen-*` crates
# (path-only, `publish = false`), these are publishable so external tools
# can depend on just the parser via a git tag — the same way this repo
# consumes ruff/oxc/sqruff parser crates. The owning analyzer crates
# (`mehen-kotlin`, `mehen-java`, `mehen-csharp`) depend on them for the
# generated grammar.
mehen-kotlin-parser = { path = "crates/mehen-kotlin-parser" }
mehen-java-parser = { path = "crates/mehen-java-parser" }
mehen-csharp-parser = { path = "crates/mehen-csharp-parser" }
mehen-markdown = { path = "crates/mehen-markdown" }
mehen-python = { path = "crates/mehen-python" }
mehen-typescript = { path = "crates/mehen-typescript" }
mehen-php = { path = "crates/mehen-php" }
mehen-ruby = { path = "crates/mehen-ruby" }
mehen-rust = { path = "crates/mehen-rust" }
mehen-go = { path = "crates/mehen-go" }
mehen-c = { path = "crates/mehen-c" }
mehen-kotlin = { path = "crates/mehen-kotlin" }
mehen-java = { path = "crates/mehen-java" }
mehen-csharp = { path = "crates/mehen-csharp" }
mehen-powershell = { path = "crates/mehen-powershell" }
mehen-sql = { path = "crates/mehen-sql" }
mehen-engine = { path = "crates/mehen-engine" }
mehen-git = { path = "crates/mehen-git" }
mehen-coverage = { path = "crates/mehen-coverage" }
mehen-report = { path = "crates/mehen-report" }

# Shared third-party deps with pinned versions. Single-consumer deps
# (e.g. `oxc_*`, `ra_ap_syntax`, `ruby-prism`, `env_logger`, `globset`,
# `ignore`, `regex`, `tree-sitter-pwsh`, `unicode-*`) are pinned inline in
# their consuming crate's `Cargo.toml` instead of here.
camino = { version = "^1.1", features = ["serde1"] }
clap = { version = "^4.6", features = ["derive"] }
log = "^0.4"
num = "^0.4"
num-derive = "^0.5"
num-traits = "^0.2"
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
smol_str = { version = "^0.3", features = ["serde"] }
gix = { version = "^0.86", default-features = false, features = ["attributes", "blob-diff", "max-performance-safe", "revision", "sha1"] }
# Read-only XML pull parsing for coverage reports (JaCoCo/Clover/Cobertura)
# and `phpunit.xml` introspection. Shared by `mehen-coverage` and
# `mehen-coverage-discovery`. Both optional features (`serialize`,
# `encoding`) stay off: parsing is hand-rolled streaming, and non-UTF-8
# report encodings are rejected as diagnostics. Keep ≥0.41 — it carries the
# fixes for RUSTSEC-2026-0194/-0195.
quick-xml = "^0.41"

# ANTLR v4 Rust runtime and code generator (`ophi-dev/antlr-rust-runtime`).
# The runtime package's library is imported as `antlr4_runtime`, so alias it
# here to match generated source. The separate codegen package is linked only
# into xtask; normal `cargo build` uses the checked-in generated modules and
# does not compile it. Keep the exact pins in lockstep, then regenerate with
# `cargo xtask antlr generate --all` so generated source and runtime agree.
antlr4_runtime = { package = "antlr-rust-runtime", version = "=0.33.1" }
antlr_rust_codegen = { package = "antlr-rust-codegen", version = "=0.33.1" }

tree-sitter = "=0.26.12"
# Per-language grammars (`tree-sitter-c`, `tree-sitter-go`,
# `tree-sitter-pwsh`)
# are pinned inline in their consuming analyzer crate. xtask reaches
# each grammar through the analyzer's `__grammar_language()` accessor
# instead of pinning grammars itself, so the kind-enum generator and
# the runtime parser always link the same revision.
# Kotlin is no longer tree-sitter-backed — it uses an ANTLR grammar
# (see the `antlr4_runtime` pin above and `crates/mehen-kotlin`).
# `tree-sitter-ruby` was removed in Phase 9 (Prism) — Ruby now flows
# through `mehen-ruby` (ruby-prism) per plan §6.5.

insta = { version = "1.47.2", features = ["yaml", "json", "redactions"] }
pretty_assertions = "^1.3"
tempfile = "^3"

[profile.dev.package.insta]
opt-level = 3

[profile.dev.package.similar]
opt-level = 3

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = "unwind"
incremental = false
overflow-checks = false
strip = "debuginfo"
